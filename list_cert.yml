- name: List certificates via TSO commands.
  hosts: all
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
    - ansible.builtin.set_fact:
        cert_type: "{{ cert_type | default('USER') }}" # CERTAUTH, SITE or USER
        cert_label: "{{ cert_label | default('zosConnectServerCert') }}"
        owner_id: "{{ owner_id | default('IBMUSER') }}" # Only required if cert_type is USER
        keyring: "{{ keyring | default('Keyring.ZOSCONN') }}"
         
    - name: List cert, print results whether it exists or not.
      block:
        - name: 'Displaying keyring {{ keyring }}.'
          ibm.ibm_zos_core.zos_tso_command:
            commands: 
              - "RACDCERT LISTRING({{ keyring }}) ID({{ owner_id }})"
          register: list_ring
          failed_when: list_ring.output[0].rc > 4

        - name: 'Displaying cert {{ cert_label }}.'
          vars:
            format_cert_type: "{{ 'ID(' + owner_id + ')' if cert_type == 'USER' else cert_type }}"
          ibm.ibm_zos_core.zos_tso_command:
            commands: 
              - "RACDCERT {{ format_cert_type }} LIST(LABEL('{{ cert_label }}'))"
          register: list_cert
          failed_when: list_cert.output[0].rc > 4

      always:
        - name: Print results from listring command.
          ansible.builtin.debug:
            var: list_ring.output[0].content
        - name: Print results from list cert command.
          ansible.builtin.debug:
            var: list_cert.output[0].content
